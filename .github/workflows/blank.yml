name: Repository CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate required files
        run: |
          test -f README.md
          test -f index.html

      - name: Validate repository does not contain unresolved merge markers
        run: |
          if git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- .; then
            echo "Found unresolved merge markers."
            exit 1
          fi

      - name: Validate index.html structure
        run: |
          python - <<'PY'
          from pathlib import Path

          html = Path("index.html").read_text(encoding="utf-8").lower()
          required_snippets = [
              "<!doctype html",
              "<head",
              "<body",
              "<title",
              "react",
              "vinyl",
          ]
          missing = [snippet for snippet in required_snippets if snippet not in html]
          if missing:
              raise SystemExit(f"index.html is missing required snippets: {', '.join(missing)}")
          print("index.html passed structural checks.")
          PY
