name: Azure Web App Deploy (manual)

on:
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
  AZURE_WEBAPP_PACKAGE_PATH: "."
  NODE_VERSION: "20.x"

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          configured=true

          if [ ! -f package.json ]; then
            echo "No package.json detected."
            configured=false
          fi

          if [ -z "${{ vars.AZURE_WEBAPP_NAME }}" ]; then
            echo "Repository variable AZURE_WEBAPP_NAME is not set."
            configured=false
          fi

          if [ -z "${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}" ]; then
            echo "Repository secret AZURE_WEBAPP_PUBLISH_PROFILE is not set."
            configured=false
          fi

          echo "configured=$configured" >> "$GITHUB_OUTPUT"

  build:
    if: needs.preflight.outputs.configured == 'true'
    runs-on: ubuntu-latest
    needs: preflight
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: npm install, build, and test
        run: |
          npm ci || npm install
          npm run build --if-present
          npm run test --if-present

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v7
        with:
          name: node-app
          path: .

  deploy:
    if: needs.preflight.outputs.configured == 'true'
    permissions:
      contents: none
    runs-on: ubuntu-latest
    needs: [preflight, build]
    environment:
      name: "Development"
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Deploy to Azure WebApp
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

  not-configured:
    if: needs.preflight.outputs.configured != 'true'
    runs-on: ubuntu-latest
    needs: preflight
    steps:
      - name: Explain why deployment was skipped
        run: |
          echo "Azure deploy skipped."
          echo "Required setup:"
          echo "- package.json in repository root"
          echo "- Repository variable: AZURE_WEBAPP_NAME"
          echo "- Repository secret: AZURE_WEBAPP_PUBLISH_PROFILE"
