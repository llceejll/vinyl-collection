name: Repository Maintenance

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - name: Mark and close stale issues and pull requests
        uses: actions/stale@v11
        with:
          stale-issue-message: >
            This issue has been inactive for 45 days. It will be closed in 10 days if there
            are no further updates.
          stale-pr-message: >
            This pull request has been inactive for 21 days. It will be closed in 7 days if
            there are no further updates.
          close-issue-message: >
            Closing as stale due to inactivity. Comment to reopen.
          close-pr-message: >
            Closing as stale due to inactivity. Comment to reopen.
          days-before-issue-stale: 45
          days-before-issue-close: 10
          days-before-pr-stale: 21
          days-before-pr-close: 7
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: pinned,security
          exempt-pr-labels: pinned,security
